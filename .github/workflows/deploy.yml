name: Deploy site (v3)

# Builds the site and publishes it to the gh-pages branch, which GitHub Pages serves.
# Runs on every push to v3, or by hand from the Actions tab ("Run workflow").
# Step 3 adds a trigger from Sanity so editing publications/news also redeploys.
on:
  push:
    branches:
      - v3
  workflow_dispatch:

# Lets the built-in GITHUB_TOKEN push to the gh-pages branch (no personal token to expire).
permissions:
  contents: write

# If two deploys start close together, only the newest one finishes.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uses the pnpm version from "packageManager" in package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
